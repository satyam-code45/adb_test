services:
  api:
    build: .
    container_name: api
    command: bash -c "cd /src/rest && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ${ADBREW_CODEBASE_PATH:-./src}/tmp:/tmp
      - ${ADBREW_CODEBASE_PATH:-./src}:/src

  app:
    # react-scripts 4 (webpack 4) doesn't run on Node 17+
    image: node:16
    container_name: app
    command: bash -c "cd /src/app && yarn install --frozen-lockfile && yarn start"
    ports:
      - "3000:3000"
    volumes:
      - ${ADBREW_CODEBASE_PATH:-./src}:/src

  mongo:
    # 4.4 matches the server the original image installed and what pymongo 3.11 supports
    image: mongo:4.4
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
